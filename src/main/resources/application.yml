server:
  port: 8080

spring:
  application:
    name: film-forest-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FILM_FOREST_DB_URL}
    username: ${FILM_FOREST_DB_USERNAME}
    password: ${FILM_FOREST_DB_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      keep-alive-between-time-millis: 90000
      remove-abandoned: true
      remove-abandoned-timeout-millis: 300000
      log-abandoned: true
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.filmforest.content.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${FILM_FOREST_JWT_SECRET}
  expiration: ${FILM_FOREST_JWT_EXPIRATION_MS:604800000}
  issuer: ${FILM_FOREST_JWT_ISSUER:film-forest}

app:
  cors:
    allowed-origins: ${FILM_FOREST_CLIENT_CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    com.filmforest: info
    com.filmforest.mapper: warn
